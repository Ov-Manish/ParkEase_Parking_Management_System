server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: parkinglot-service
              uri: lb://parkinglot-service
              predicates:
                - Path=/api/v1/lots/**

            - id: spot-service
              uri: lb://spot-service
              predicates:
                - Path=/api/v1/spots/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**, /api/v1/wallets/**

            - id: vehicle-service
              uri: lb://vehicle-service
              predicates:
                - Path=/api/v1/vehicles/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info